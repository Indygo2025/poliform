<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 132" role="img" aria-label="Пластмассовые листы и плиты">
  <defs>
    <linearGradient id="shFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/><stop offset=".38" stop-color="#e6e3dc"/>
      <stop offset=".55" stop-color="#f7f6f2"/><stop offset="1" stop-color="#cfcbc2"/>
    </linearGradient>
    <linearGradient id="shSide" x1="0" y1="0" x2="0" y2="1">
